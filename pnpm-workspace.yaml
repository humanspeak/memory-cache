packages:
    - .
    - docs
allowBuilds:
    # pnpm ≥11.23 requires git-hosted deps to be allowlisted by their
    # commit-free repo key — a bare package name only matches registry
    # packages. This one entry covers every docs-kit tag.
    '@humanspeak/docs-kit@git+https://github.com/humanspeak/docs-kit.git': true
    # core-js (via posthog-js) only runs a funding banner on postinstall.
    core-js: false
    esbuild: true
    sharp: true
    workerd: true

onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
    - esbuild
    - sharp
    - workerd
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
overrides:
    cookie: '>=0.7.0'
